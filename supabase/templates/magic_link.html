<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f7f4ef;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#2a2826;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;padding:40px 32px;">
            <tr>
              <td style="font-family:Georgia,'Times New Roman',serif;font-size:22px;letter-spacing:0.02em;">
                Nata Studio<span style="color:#c4401c;">.</span>
              </td>
            </tr>
            <tr>
              <td style="padding-top:28px;font-size:16px;line-height:1.6;">
                Here's your link to the client portal, where you can follow your project, review work and download files.
              </td>
            </tr>
            <tr>
              <td style="padding-top:28px;">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
                   style="display:inline-block;background:#2a2826;color:#ffffff;text-decoration:none;padding:14px 28px;border-radius:999px;font-size:15px;">
                  Open my portal
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding-top:28px;font-size:12px;line-height:1.6;color:#8f8a83;">
                The link expires in 15 minutes and works once. If you didn't ask for this, you can ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
